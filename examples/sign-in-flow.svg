<svg width="1200" height="700" viewBox="0 0 1200 700" fill="none" xmlns="http://www.w3.org/2000/svg">
<metadata id="ai-annotations"><![CDATA[
{
  "about": "Notes for an AI agent from the SVG Annotate plugin, in this SVG's viewBox units: a pin or text marks x,y; rect, ellipse, pen and highlight mark the area x,y,w,h; an arrow runs from x,y to x2,y2. target and target2 name the layers there; text is the note.",
  "notes": [
    {
      "id": "demo1",
      "kind": "rect",
      "x": 78,
      "y": 194,
      "w": 404,
      "h": 180,
      "color": "#e5484d",
      "width": 4,
      "target": "#Sign in > #Email field",
      "text": "Validate the email format and show the error under the field. Password needs 8+ characters."
    },
    {
      "id": "demo2",
      "kind": "pin",
      "x": 492,
      "y": 387,
      "color": "#f5a524",
      "target": "#Sign in > #Forgot password",
      "text": "Opens the reset flow. Reuse the existing email modal."
    },
    {
      "id": "demo3",
      "kind": "arrow",
      "x": 472,
      "y": 450,
      "x2": 676,
      "y2": 210,
      "color": "#3e63dd",
      "width": 4,
      "target": "#Sign in > #Continue button > #Continue bg",
      "target2": "#Dashboard > #Card balance",
      "text": "On success, open the dashboard and keep the session for 30 days."
    },
    {
      "id": "demo4",
      "kind": "highlight",
      "x": 710,
      "y": 77,
      "w": 92,
      "h": 0,
      "points": [710, 77, 802, 77],
      "color": "#f5a524",
      "width": 22,
      "target": "#Dashboard > #Greeting",
      "text": "Use the first name from /api/me."
    },
    {
      "id": "demo5",
      "kind": "ellipse",
      "x": 880,
      "y": 200,
      "w": 190,
      "h": 60,
      "color": "#30a46c",
      "width": 4,
      "target": "#Dashboard > #Balance amount",
      "text": "Format with the account currency, two decimals."
    }
  ]
}
]]></metadata>
<rect id="Canvas" width="1200" height="700" fill="#EEF0F4"/>
<g id="Sign in">
<rect id="Sign in-bg" x="40" y="40" width="480" height="620" rx="16" fill="white"/>
<text id="Title" fill="#111827" font-family="Arial" font-size="32" font-weight="bold"><tspan x="88" y="130">Sign in</tspan></text>
<text id="Subtitle" fill="#6B7280" font-family="Arial" font-size="16"><tspan x="88" y="162">Welcome back to Acme</tspan></text>
<g id="Email field">
<text id="Email label" fill="#374151" font-family="Arial" font-size="14"><tspan x="88" y="214">Email</tspan></text>
<rect id="Email input" x="88" y="226" width="384" height="48" rx="8" stroke="#D1D5DB" stroke-width="1.5"/>
<text id="Email placeholder" fill="#9CA3AF" font-family="Arial" font-size="15"><tspan x="104" y="255">you@example.com</tspan></text>
</g>
<g id="Password field">
<text id="Password label" fill="#374151" font-family="Arial" font-size="14"><tspan x="88" y="304">Password</tspan></text>
<rect id="Password input" x="88" y="316" width="384" height="48" rx="8" stroke="#D1D5DB" stroke-width="1.5"/>
</g>
<text id="Forgot password" fill="#3E63DD" font-family="Arial" font-size="14"><tspan x="352" y="392">Forgot password?</tspan></text>
<g id="Continue button">
<rect id="Continue bg" x="88" y="424" width="384" height="52" rx="8" fill="#3E63DD"/>
<text id="Continue label" fill="white" font-family="Arial" font-size="16" font-weight="bold"><tspan x="246" y="456">Continue</tspan></text>
</g>
<text id="Sign up hint" fill="#6B7280" font-family="Arial" font-size="14"><tspan x="200" y="540">No account? Create one</tspan></text>
</g>
<g id="Dashboard">
<rect id="Dashboard-bg" x="680" y="40" width="480" height="620" rx="16" fill="white"/>
<rect id="Header" x="680" y="40" width="480" height="72" rx="16" fill="#111827"/>
<rect id="Header base" x="680" y="80" width="480" height="32" fill="#111827"/>
<text id="Greeting" fill="white" font-family="Arial" font-size="20" font-weight="bold"><tspan x="712" y="84">Hi, Ren</tspan></text>
<rect id="Card balance" x="712" y="144" width="416" height="128" rx="12" fill="#F3F4F6"/>
<text id="Balance label" fill="#6B7280" font-family="Arial" font-size="14"><tspan x="736" y="180">Balance</tspan></text>
<text id="Balance amount" fill="#111827" font-family="Arial" font-size="30" font-weight="bold"><tspan x="896" y="240">$2,480.00</tspan></text>
<rect id="Card activity" x="712" y="296" width="416" height="232" rx="12" fill="#F3F4F6"/>
<text id="Activity title" fill="#111827" font-family="Arial" font-size="16" font-weight="bold"><tspan x="736" y="332">Recent activity</tspan></text>
<rect id="Row 1" x="736" y="356" width="368" height="40" rx="6" fill="white"/>
<rect id="Row 2" x="736" y="408" width="368" height="40" rx="6" fill="white"/>
<rect id="Row 3" x="736" y="460" width="368" height="40" rx="6" fill="white"/>
<rect id="Sign out" x="712" y="580" width="416" height="44" rx="8" stroke="#D1D5DB" stroke-width="1.5"/>
<text id="Sign out label" fill="#374151" font-family="Arial" font-size="15"><tspan x="886" y="607">Sign out</tspan></text>
</g>
</svg>
